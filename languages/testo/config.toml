name = "Testo"
grammar = "testo"
path_suffixes = ["testo"]
line_comments = ["#"]
tab_size = 4
hard_tabs = false

# Indentation rules that don't depend on the syntax tree.
increase_indent_pattern = "\\{\\s*$"
decrease_indent_pattern = "^\\s*\\}"

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]

# NB: deliberately no `[overrides.string] word_characters` entry here.
# Marking `${`, `$<`, ... as word characters makes the word-based completion
# swallow the prefix: completing `"${PAR<Tab>"` would replace `${PAR` and
# produce `"PARAM1}"` instead of `"${PARAM1}"`. The default already treats
# letters, digits and `_` as word characters, which is all Testo needs.
